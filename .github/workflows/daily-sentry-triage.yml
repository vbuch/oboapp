name: Daily Sentry investigation

on:
  schedule:
    # After the regular afternoon scans: 19:17 Sofia in winter, 20:17 in summer.
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-sentry-triage
  cancel-in-progress: false

env:
  TRIAGE_DIRECTORY: /tmp/sentry-triage

jobs:
  collect:
    if: >-
      github.repository == 'vbuch/oboapp' && github.ref == 'refs/heads/main' &&
      (vars.SENTRY_TRIAGE_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      has_work: ${{ steps.evidence.outputs.has_work }}
    steps:
      - name: Check OpenAI configuration
        env:
          OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$OPENAI_KEY_CONFIGURED" != "true" ]; then
            echo "::error::Configure OPENAI_API_KEY before enabling the daily pilot."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Authenticate for read-only Cloud Run evidence
        if: vars.SENTRY_TRIAGE_GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SENTRY_TRIAGE_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: vars.SENTRY_TRIAGE_GCP_SERVICE_ACCOUNT != ''

      - name: Collect recent failures and existing issue context
        id: evidence
        env:
          TRIAGE_PHASE: collect
          SENTRY_TRIAGE_TOKEN: ${{ secrets.SENTRY_TRIAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TRIAGE_CLOUD_LOGS: ${{ vars.SENTRY_TRIAGE_GCP_SERVICE_ACCOUNT != '' }}
        run: node .github/scripts/run-sentry-triage.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: sentry-evidence
          path: ${{ env.TRIAGE_DIRECTORY }}/evidence.json
          retention-days: 7

  investigate:
    needs: collect
    if: needs.collect.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: sentry-evidence
          path: ${{ env.TRIAGE_DIRECTORY }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Investigate and prepare implementation issues
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_TRIAGE_MODEL: ${{ vars.SENTRY_TRIAGE_MODEL }}
        run: node .github/scripts/sentry-investigation.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: sentry-investigation
          path: ${{ env.TRIAGE_DIRECTORY }}
          retention-days: 7
          if-no-files-found: error

  validate:
    needs: investigate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: sentry-investigation
          path: ${{ env.TRIAGE_DIRECTORY }}

      - name: Validate the investigation report
        env:
          TRIAGE_PHASE: validate
        run: node .github/scripts/run-sentry-triage.mjs

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: sentry-investigation
          path: ${{ env.TRIAGE_DIRECTORY }}
      - name: Publish the daily report and implementation issues
        env:
          TRIAGE_PHASE: publish
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/run-sentry-triage.mjs
