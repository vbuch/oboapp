name: Test Sentry investigation

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/sentry-triage*
      - .github/workflows/*sentry-triage.yml
      - agent-context/.apm/prompts/daily-sentry-triage.prompt.md
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/sentry-triage*
      - .github/workflows/*sentry-triage.yml
      - agent-context/.apm/prompts/daily-sentry-triage.prompt.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
